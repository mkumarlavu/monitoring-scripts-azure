name: NWB collector health

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish health records to Azure (false previews only)
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  health:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.CICD_MONITOR_HEALTH_ENABLED == 'true')
    runs-on: ${{ fromJSON(vars.CICD_MONITOR_RUNNER_LABELS) }}
    environment:
      name: cicd-observability
      deployment: false
    timeout-minutes: 15
    steps:
      - name: Check out trusted monitoring code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Sign in to Azure
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish) ||
          (github.event_name == 'schedule' && vars.CICD_MONITOR_HEALTH_PUBLISH == 'true')
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
      - name: Observe collector results and publish heartbeat
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          HEALTH_PUBLISH: ${{ vars.CICD_MONITOR_HEALTH_PUBLISH }}
          AZURE_DCE_LOGS_ENDPOINT: ${{ vars.AZURE_DCE_LOGS_ENDPOINT }}
          AZURE_HEALTH_DCR_IMMUTABLE_ID: ${{ vars.AZURE_HEALTH_DCR_IMMUTABLE_ID }}
        run: |
          $publish = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $env:MANUAL_PUBLISH -eq 'true'
          } else { $env:HEALTH_PUBLISH -eq 'true' }
          ./scripts/nwb-observability/Invoke-CollectorHealth.ps1 -Publish:$publish
