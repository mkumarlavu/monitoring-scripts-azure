name: NWB collector health
on:
  schedule:
    # Daily at 1 PM and 5 PM Eastern, including daylight-saving changes.
    - cron: '0 13,17 * * *'
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      publish:
        description: Publish health records to Azure; false previews only
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  health:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.CICD_MONITOR_HEALTH_ENABLED == 'true')
    uses: northwest/devops-workflows/.github/workflows/nwb-collector-health-reusable.yml@main
    with:
      runner_labels: ${{ vars.CICD_MONITOR_RUNNER_LABELS }}
      publish: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'schedule' && vars.CICD_MONITOR_HEALTH_PUBLISH == 'true') }}
