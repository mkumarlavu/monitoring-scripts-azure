# Merge with config/nwb-observability/release-targets.json containing real targets.
# The Azure identity needs Reader on each configured Container App.
name: NWB version inventory
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish observed versions to Azure
        default: false
        type: boolean
permissions:
  contents: read
  id-token: write
jobs:
  inventory:
    uses: northwest/devops-workflows/.github/workflows/nwb-version-inventory-reusable.yml@main
    with:
      runner_labels: ${{ vars.CICD_MONITOR_RUNNER_LABELS }}
      publish: ${{ inputs.publish }}
