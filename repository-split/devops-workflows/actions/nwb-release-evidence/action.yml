name: NWB release evidence
description: Report release/check outcomes or read active Container App revisions for configured environments.
inputs:
  operation:
    description: release or inventory
    required: true
  config_path:
    description: Path to reviewed release target configuration in the caller workspace
    required: true
  evidence_path:
    description: Path to release report JSON generated by the application pipeline
    default: ''
  publish:
    description: Publish to Azure; false prints a preview
    default: 'false'
runs:
  using: composite
  steps:
    - name: Publish release evidence or inventory
      shell: pwsh
      env:
        NWB_RELEASE_ACTION_PATH: ${{ github.action_path }}
        NWB_RELEASE_OPERATION: ${{ inputs.operation }}
        NWB_RELEASE_CONFIG: ${{ inputs.config_path }}
        NWB_RELEASE_EVIDENCE: ${{ inputs.evidence_path }}
        NWB_RELEASE_PUBLISH: ${{ inputs.publish }}
      run: |
        $script = Join-Path $env:NWB_RELEASE_ACTION_PATH '../nwb-cicd-monitoring/scripts/Send-ReleaseEvidence.ps1'
        & $script -Operation $env:NWB_RELEASE_OPERATION -ConfigPath $env:NWB_RELEASE_CONFIG -EvidencePath $env:NWB_RELEASE_EVIDENCE -Publish:([bool]::Parse($env:NWB_RELEASE_PUBLISH))
