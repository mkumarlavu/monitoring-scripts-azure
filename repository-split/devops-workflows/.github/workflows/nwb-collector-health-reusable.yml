name: NWB reusable collector health
on:
  workflow_call:
    inputs:
      runner_labels:
        description: JSON array of approved caller runner labels
        required: true
        type: string
      publish:
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  health:
    if: >-
      github.repository_owner == 'northwest' &&
      github.server_url == 'https://northwest.ghe.com' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    environment:
      name: cicd-observability
      deployment: false
    timeout-minutes: 15
    steps:
      - name: Sign in to Azure
        if: inputs.publish
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange
      - name: Observe the calling repository collector
        # Shared script updates are adopted from the central main branch.
        uses: northwest/devops-workflows/actions/nwb-cicd-monitoring@main
        with:
          operation: health
          publish: ${{ inputs.publish }}
        env:
          AZURE_DCE_LOGS_ENDPOINT: ${{ vars.AZURE_DCE_LOGS_ENDPOINT }}
          AZURE_HEALTH_DCR_IMMUTABLE_ID: ${{ vars.AZURE_HEALTH_DCR_IMMUTABLE_ID }}
